<section class="w-full mb-5" id="mis-publicaciones">
    {% if mis_discos %}
    <h2 class="text-xl font-bold mb-4">Mis Publicaciones</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        {% for disco in mis_discos %}
        <div class="card bg-base-200/70 border border-base-content/10 w-full h-full shadow-md transition-all duration-300 hover:shadow-xl hover:-translate-y-1 group">
            <figure class="relative h-48 overflow-hidden rounded-t-2xl">
                <img
                    src="{{ disco.imagen }}"
                    alt="{{ disco.titulo }}"
                    class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
                />
                <div class="absolute top-2 right-2 badge {{ 'badge-accent' if disco.formato else 'badge-primary' }} shadow-sm">
                    {{ 'Vinilo' if disco.formato == 1 else 'CD' }}
                </div>
                <div class="absolute top-2 left-2 badge badge-secondary badge-outline shadow-sm backdrop-blur-sm bg-base-100/70">
                    <strong>${{ "%.2f"|format(disco.precio) }}</strong>
                </div>
            </figure>
            <div class="card-body p-4">
                <h3 class="card-title text-base line-clamp-2 items-start">
                    {{ disco.titulo }}
                </h3>
                <p class="text-sm text-base-content/70 line-clamp-1 mb-1">
                    {{ disco.artista }}
                </p>
                <p class="text-xs text-base-content/50 line-clamp-2 mb-3">
                    {{ disco.descripcion or 'Sin descripción' }}
                </p>
                <div class="card-actions justify-end gap-2 mt-auto pt-2 border-t border-base-content/5">
                    <!-- Botón EDITAR en _mis_discos.html -->
                    <button
                        onclick="abrirModalEditar({{ disco.id_disco }})"
                        class="btn btn-xs btn-outline btn-primary gap-1"
                    >
                        Editar
                    </button>

                    <!-- Botón ELIMINAR en _mis_discos.html -->
                    <button
                        onclick="abrirModalEliminar({{ disco.id_disco }})"
                        class="btn btn-xs btn-outline btn-error gap-1"
                    >
                        Eliminar
                    </button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="alert alert-info shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current shrink-0 w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span>Aún no has publicado ningún disco. ¡Usa el botón + para comenzar!</span>
    </div>
    {% endif %}
</section>
